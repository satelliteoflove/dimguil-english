# Weekly pull requests for newer GitHub Actions, monthly for the Kotlin/Gradle side.
# Merging one runs the full build on main (see workflows/release.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']
