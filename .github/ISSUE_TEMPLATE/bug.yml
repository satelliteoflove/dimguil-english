name: Bug report
description: Something breaks, freezes, looks wrong on screen, or behaves in unexpected ways.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the [known issues](https://github.com/satelliteoflove/dimguil-english/issues?q=label%3A%22known+issue%22) first, in case it's already there.
  - type: input
    id: version
    attributes:
      label: Patch version
      description: It's in the name of the patch file, e.g. v0.8.0.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: What you're playing on
      description: Emulator and version (e.g. DuckStation 0.1-xxxx, RetroArch with Beetle PSX HW), or console model and how you run the disc.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the game
      description: Town or maze floor, which shop or NPC, which menu, and so on.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images in here. A screenshot helps a lot, especially for text problems.
  - type: dropdown
    id: reproducible
    attributes:
      label: Does it happen again if you repeat it?
      options:
        - "Yes, every time"
        - "Sometimes"
        - "Only happened once"
        - "Haven't tried"
